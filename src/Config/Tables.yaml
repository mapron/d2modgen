            - calc4
            - calc5
            - calc6
            - calc7
            - calc8
            - calc9
            - calc10

      aurastatcalc:
        type: string
        dynamic_array: { max: 6, column: "aurastatcalc{i}" }

      aurastat:
        type: string
        dynamic_array: { max: 6, column: "aurastat{i}" }

      passivestat:
        type: string
        dynamic_array: { max: 14, column: "passivestat{i}" }

    aliases:
      id: "*id"

  treasureclassex:
    fields:
      name:     { column: treasure class, type: string }
      k_unique: { column: unique,         type: int }
      k_set:    { column: set,            type: int }
      k_rare:   { column: rare,           type: int }
      k_magic:  { column: magic,          type: int }
      noDrop:   { column: nodrop,         type: int }
      group:    { column: group,          type: int }
      picks:    { column: picks,          type: int }
      level:    { column: level,          type: int }

      items:
        dynamic_array:
          name: Item
          max: 10
          nonempty: tc
          fields:
            prob: { column: "prob{i}", type: int }
            tc:   { column: "item{i}", type: string }

  missiles:
    fields:
      name:  { column: missile, type: string }
      id:    { column: "*id",   type: int }
      eType: { column: etype,   type: string }

      color:
        struct:
          name: Color
          fields:
            red:   { column: red,   type: int }
            green: { column: green, type: int }
            blue:  { column: blue,  type: int }

      skill:          { column: skill,          type: string }
      missileSkill:   { column: missileskill,   type: int }
      EDmgSymPerCalc: { column: edmgsympercalc, type: string }

      childmissile:
        type: string
        fixed_array:
          columns:
            - explosionmissile
            - submissile1
            - submissile2
            - submissile3
            - hitsubmissile1
            - hitsubmissile2
            - hitsubmissile3
            - hitsubmissile4
            - cltsubmissile1
            - cltsubmissile2
            - cltsubmissile3
            - clthitsubmissile1
            - clthitsubmissile2
            - clthitsubmissile3
            - clthitsubmissile4

    aliases:
      id: "*id"

  inventory:
    fields:
      charclass: { column: class, type: string }
      gridX:     { column: gridx, type: int }
      gridY:     { column: gridy, type: int }

  lvlmaze:
    fields:
      name:    { column: name,  type: string }
      levelId: { column: level, type: int }

      rooms:
        type: int
        fixed_array:
          columns: [rooms, "rooms(n)", "rooms(h)"]

  superuniques:
    fields:
      monsterClass: { column: class, type: string }

  weapons:
    extends: equipment
    fields:
      mindam: { column: mindam, type: int }
      maxdam: { column: maxdam, type: int }

  armor:
    extends: equipment
    fields:
      minac: { column: minac, type: int }
      maxac: { column: maxac, type: int }

  misc:
    extends: equipment_core
    fields:
      maxstack: { column: maxstack, type: int }

  automagic:
    extends: affixes

  magicprefix:
    extends: affixes

  magicsuffix:
    extends: affixes

  uniqueitems:
    extends: unique_set
    fields:
      carry1:  { column: carry1,  type: int }
      version: { column: version, type: int }

      affixes:
        affix_list:
          max: 12
          columns:
            code: "prop{i}"
            par:  "par{i}"
            min:  "min{i}"
            max:  "max{i}"

  setitems:
    extends: unique_set
    fields:
      addfunc:  { column: add func, type: int }
      setIndex: { column: set,      type: string }

      affixes_base:
        affix_list:
